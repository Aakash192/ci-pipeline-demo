# Display name shown in the GitHub Actions tab
name: CI pipeline

# Triggers: when should this workflow run?
on:
  # Run on every push to any branch
  push:
    branches:
    - '**'
  # Run on pull requests targeting the main branch
  pull_request:
   branches:
    - main

jobs:
  # Define a job called 'test'
  test:
    # Use a gitHub-hosted ubuntu virtual machine
    runs-on: ubuntu-latest

    steps:
      # Download your repository's code
      - name: Checkout code
        uses: actions/checkout@v6
      
      # Install Node.js on the runner
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # Install dependencies using the exact lockfile versions
      - name: Install dependencies
        run: npm ci

      # Execute the test suite
      - name: Run tests
        run: npm test